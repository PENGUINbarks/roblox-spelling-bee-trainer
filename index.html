  <meta charset="UTF-8" />

    #wordDisplay {
      font-size: 2.4rem; letter-spacing: 0.15em;
      word-break: break-all; overflow-wrap: break-word; line-height: 1.3;
      max-height: 220px; overflow-y: auto;
    }
    #wordDisplay.long-word { font-size: 1.7rem; }

<!-- ... (HTML structure remains exactly the same as before) ... -->

<script>
// WORD LIST (unchanged)
const rawWordList = `... (your full raw word list here - same as before) ...`;

let allWords = rawWordList.split(',').flatMap(item => {
  const cleaned = item.trim().toLowerCase();
  return cleaned.includes(' / ') ? cleaned.split(' / ') : [cleaned];
}).filter(Boolean);

const extraHard = [
  "antidisestablishmentarianism","floccinaucinihilipilification","supercalifragilisticexpialidocious",
  "pneumonoultramicroscopicsilicovolcanoconiosis","hippopotomonstrosesquippedaliophobia",
  "pseudopseudohypoparathyroidism","adrenocorticotrophin","ventriculocisternostomy",
  "canaliculodacryocystorhinostomy","thyroparathyroidectomize","dichlorodiphenyltrichloroethane",
  "radioimmunoelectrophoresis","counterimmunoelectrophoresis","gastrointestinal",
  "electroencephalograph","otorhinolaryngologist","psychoneuroimmunology",
  "hepaticocholangiocholecystenterostomy","oligonucleotide"
];

allWords = [...new Set([...allWords, ...extraHard])];

const wordsByLevel = {
  1: allWords.filter(w => w.length <= 5),
  2: allWords.filter(w => w.length >= 6 && w.length <= 8),
  3: allWords.filter(w => w.length >= 9 && w.length <= 11),
  4: allWords.filter(w => w.length >= 12 || /ph|ch|x|z/.test(w)),
  5: allWords.filter(w => w.length >= 14 || w.includes("psych") || w.includes("electro")),
  6: allWords.filter(w => w.length >= 18 || w.includes("immuno") || w.includes("anti") || w.includes("pseudo")),
  7: allWords.filter(w => w.length >= 25 || w.includes("chargogg") || w.includes("flocci") || w.includes("pneumono"))
};

// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let selectedLevel = 1;
let selectedMode = "practice";
let selectedProgressive = true;
let selectedTimerOn = true;
let selectedTimerSeconds = 6;

let customWords = [];

let gameStarted = false;
let currentWord = "";
let streak = 0;
let score = 0;
let totalAttempts = 0;
let correctCount = 0;
let mistakes = 0;
let totalCorrectChars = 0;
let totalCorrectSeconds = 0;   // only time from correct answers
let timerId = null;
let timeLeft = 6;
let startTime = 0;
let level = 1;

const els = {
  // ... same as before ...
};

// ────────────────────────────────────────────────
// SPELLING NORMALIZATION (new)
// ────────────────────────────────────────────────
function normalizeSpelling(word) {
  return word
    .replace(/ou?r/g, 'or')           // colour → color, favourite → favorite
    .replace(/i?se/g, 'ize')          // realise → realize, organise → organize
    .replace(/re$/g, 'er')            // centre → center, theatre → theater
    .replace(/ll/g, 'l')              // travelled → traveled, jewellery → jewelry
    .replace(/og/g, 'og')             // catalogue → catalog (already handled by /ou?r/)
    .replace(/oe/g, 'o')              // diarrhoea → diarrhea
    .replace(/ae/g, 'e')              // paedophile → pedophile
    .replace(/yze/g, 'yze')           // analyse → analyze (keep yze for US)
    .replace(/yse/g, 'yze');          // analyse → analyze
}

// ────────────────────────────────────────────────
// GAME FUNCTIONS (updated)
// ────────────────────────────────────────────────
function checkAnswer() {
  const userAnswer = els.answerInput.value.trim();
  const userLower = normalizeSpelling(userAnswer.toLowerCase());
  const correctLower = normalizeSpelling(currentWord.toLowerCase());
  const isCorrect = userLower === correctLower;

  const secondsTaken = (Date.now() - startTime) / 1000;

  totalAttempts++;
  if (isCorrect) {
    correctCount++;
    totalCorrectChars += currentWord.length;
    totalCorrectSeconds += secondsTaken > 0.5 ? secondsTaken : 0.5; // min 0.5s
    streak++;
    score += level * 10 + (selectedTimerOn ? Math.floor(timeLeft * 2) : 5);
  } else {
    streak = 0;
    mistakes++;
  }

  els.modalIcon.textContent = isCorrect ? "🎉" : "❌";
  els.modalTitle.textContent = isCorrect ? "CORRECT!" : "WRONG";
  els.modalTitle.style.color = isCorrect ? "#10b981" : "#ef4444";

  els.yourTyped.innerHTML = `You typed: <span class="${isCorrect ? 'text-emerald-400' : 'text-red-400 line-through'}">${userAnswer.toUpperCase() || "(nothing)"}</span>`;
  els.modalWord.textContent = currentWord.toUpperCase();

  els.modal.classList.remove("hidden");
  els.modal.classList.add("flex");

  updateStats();
  clearInterval(timerId);
}

function updateStats() {
  els.streakEl.textContent = streak;
  els.scoreEl.textContent = score;
  els.levelEl.textContent = level === 99 ? "CUSTOM" : level;
  els.mistakesEl.textContent = mistakes;

  const accuracy = totalAttempts === 0 ? 100 : Math.round((correctCount / totalAttempts) * 100);
  els.accEl.textContent = accuracy;

  let wpm = 0;
  if (totalCorrectSeconds > 0.5) {
    const minutes = totalCorrectSeconds / 60;
    wpm = Math.round((totalCorrectChars / 5) / minutes);
  }
  els.wpmEl.textContent = wpm;
}

// ... all other functions remain the same as in the previous full code ...

// START
window.onload = () => {
  populateMenuDiffButtons();
  setMode("practice");
  updateMenuTimerValue();
  document.getElementById("menuTimerSlider").oninput = updateMenuTimerValue;
  renderCustomList();
};
</script>
</body>
</html>
