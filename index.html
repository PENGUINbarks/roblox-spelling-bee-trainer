function populateMenuDiffButtons() {
  const cont = document.getElementById("menuDiffButtons");

  const labels = ["Beginner","Novice","Moderate","Advanced","Expert","Genius","Master","Randomiser"];
  const emojis = ["🐣","🌱","🌿","🔥","⚡","🧠","👑","🎲"];

    const btn = document.createElement("button");
    btn.innerHTML = emojis[i-1] + "<br>" + labels[i-1];
    btn.className = `px-6 py-4 rounded-2xl text-sm font-bold transition ${i===selectedLevel ? 'bg-yellow-500 text-black scale-105' : 'bg-zinc-800 hover:bg-zinc-700'}`;
