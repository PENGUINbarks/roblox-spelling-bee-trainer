<head>
  <meta charset="UTF-8" />

  <title>🐝 Spelling Bee Trainer - Roblox Edition</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body { font-family: 'Press Start 2P', system-ui; margin: 0; padding: 0; }
    .bee { animation: buzz 0.6s infinite alternate; }
    @keyframes buzz { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }

    #wordDisplay {
      font-size: 2.4rem; letter-spacing: 0.15em;
      word-break: break-all; overflow-wrap: break-word; line-height: 1.3;
      max-height: 220px; overflow-y: auto;
    }
    #wordDisplay.long-word { font-size: 1.7rem; }

    .progress-bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: #eab308; transition: width 0.4s; }

    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    .search-wrapper { position: relative; flex: 1; min-width: 200px; }
    .search-clear { 
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #9ca3af; font-size: 1.25rem; cursor: pointer;
      display: none;
    }
    .search-clear:hover { color: white; }
  </style>
</head>

      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 text-center">
        <div class="bg-zinc-950/70 rounded-2xl p-3 md:p-4"><div class="text-xs md:text-sm text-zinc-500">STREAK</div><div id="streak" class="text-3xl md:text-4xl font-bold text-emerald-400">0</div></div>
        <div class="bg-zinc-950/70 rounded-2xl p-3 md:p-4"><div class="text-xs md:text-sm text-zinc-500">SCORE</div><div id="score" class="text-3xl md:text-4xl font-bold text-yellow-400">0</div></div>
        <div class="bg-zinc-950/70 rounded-2xl p-3 md:p-4"><div class="text-xs md:text-sm text-zinc-500">LEVEL</div><div id="level" class="text-3xl md:text-4xl font-bold text-purple-400">Beginner</div></div>
        <div class="bg-zinc-950/70 rounded-2xl p-3 md:p-4"><div class="text-xs md:text-sm text-zinc-500">ACC %</div><div id="accuracy" class="text-3xl md:text-4xl font-bold text-sky-400">100</div></div>
        <div class="bg-zinc-950/70 rounded-2xl p-3 md:p-4"><div class="text-xs md:text-sm text-zinc-500">MISTAKES</div><div id="mistakes" class="text-3xl md:text-4xl font-bold text-red-400">0</div></div>
        <div class="bg-zinc-950/70 rounded-2xl p-3 md:p-4">
          <div class="text-xs md:text-sm text-zinc-500">WPM</div>
          <div id="wpm" class="text-3xl md:text-5xl font-bold text-orange-400">0</div>
          <div id="wpmRank" class="text-xs font-bold mt-1"></div>
        </div>
      </div>
    </div>

    <div class="p-4 md:p-6 bg-black flex flex-wrap items-center justify-between text-sm border-t border-zinc-800 gap-4">
      <button onclick="showMenu()" class="flex items-center gap-2 text-zinc-400 hover:text-white"><i class="fa-solid fa-rotate-left"></i> MENU</button>
      <button id="timerToggleBtn" onclick="toggleTimer()" class="flex items-center gap-2 text-emerald-400"><i class="fa-solid fa-clock"></i> TIMER ON</button>
    </div>
  </div>
</div>
